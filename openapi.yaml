openapi: 3.1.0
info:
  title: Dental Lab CRM API
  version: 0.2.0-mock
  summary: API-only mock contract for web and future mobile clients
  description: |
    Draft Swagger/OpenAPI specification for `dental-lab-crm`.
    The current runtime is API-only demo mode: auth is bypassed, Prisma and
    Supabase are disconnected, and mutations are in-memory for the active
    server process.

    Reference entities used by cases are archived instead of hard-deleted.
    Archived references are hidden from default management lists and creation
    option/dropdown endpoints, but historical case reads still include related
    archived records.
servers:
  - url: http://localhost:3000
    description: Local development
security: []
tags:
  - name: Auth
  - name: Dashboard
  - name: Cases
  - name: Kanban
  - name: Production
  - name: Registry
  - name: Processes
paths:
  /api/me:
    get:
      tags: [Auth]
      summary: Get mock current user
      description: Returns the fixed demo user profile for mock session bootstrap.
      operationId: getCurrentUser
      responses:
        "200":
          description: Current user returned successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          description: Not used in the current mock runtime
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/dashboard:
    get:
      tags: [Dashboard]
      summary: Get mock dashboard data
      description: Returns summary, designer stats, and status chart data from the in-memory mock store.
      operationId: getDashboard
      responses:
        "200":
          description: Dashboard data returned successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    additionalProperties: true
                  error:
                    type: "null"
                  meta:
                    type: object
                    additionalProperties: true
  /api/cases:
    get:
      tags: [Cases]
      summary: List cases
      description: Returns lightweight case summaries inside the standard response envelope. Included case reference names are returned even when the referenced row has since been archived. Rich case detail, processes, dependencies, attachments, components, and milling rows are available from GET /api/cases/{id}.
      operationId: listCases
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
          description: Maximum number of newest matching cases to return.
        - in: query
          name: status
          schema:
            $ref: "#/components/schemas/CaseStatus"
        - in: query
          name: customerId
          schema:
            type: string
        - in: query
          name: urgent
          schema:
            type: string
            enum: [urgent, normal, "true", "false"]
        - in: query
          name: q
          schema:
            type: string
          description: Search by case code, client case code, patient, customer, dentist, service type, or CAD designer.
        - in: query
          name: search
          schema:
            type: string
          deprecated: true
          description: Alias for q.
      responses:
        "200":
          description: Case list returned successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseListResponse"
    post:
      tags: [Cases]
      summary: Create case
      description: Creates a new dental case entry for the authenticated user's dental lab. Case codes are generated by the backend from existing numeric codes in that lab; any request body `code` value is ignored. Selected reference ids must be active, unarchived, and scoped to the same lab.
      operationId: createCase
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCaseRequest"
      responses:
        "201":
          description: Case created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseMutationResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/cases/{id}:
    get:
      tags: [Cases]
      summary: Get case details
      description: Returns the full detail of a single case from the in-memory mock store.
      operationId: getCaseById
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Case detail returned successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseResponse"
        "404":
          description: Case not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      tags: [Cases]
      summary: Update case
      description: Updates editable case fields in the in-memory mock store.
      operationId: updateCase
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCaseRequest"
      responses:
        "200":
          description: Case updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseMutationResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [Cases]
      summary: Delete case
      description: Deletes a case and related mock production records from the in-memory mock store.
      operationId: deleteCase
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Case deleted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteEntityResponse"
        "400":
          description: Case cannot be deleted because attachments are still retained
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Case not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/cases/{id}/attachments:
    post:
      tags: [Cases]
      summary: Upload case attachment
      description: Creates mock file metadata with 90-day retention. No Supabase storage upload occurs in the mock runtime.
      operationId: uploadCaseAttachment
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [kind, file]
              properties:
                kind:
                  $ref: "#/components/schemas/AttachmentKind"
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Attachment uploaded successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistryEntityMutationResponse"
        "400":
          description: Invalid upload payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/cases/{id}/attachments/{attachmentId}:
    delete:
      tags: [Cases]
      summary: Delete case attachment
      description: Deletes mock file attachment metadata from the in-memory mock store.
      operationId: deleteCaseAttachment
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: path
          name: attachmentId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Attachment deleted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteEntityResponse"
        "404":
          description: Attachment not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/cases/downloads:
    post:
      tags: [Cases]
      summary: Generate signed attachment download URLs
      description: Returns mock temporary URLs for case attachments by ids and kind filter.
      operationId: createCaseDownloadUrls
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [caseIds]
              properties:
                caseIds:
                  type: array
                  items:
                    type: string
                kind:
                  type: string
                  enum:
                    [
                      SCAN_INPUT,
                      DESIGN_OUTPUT,
                      MODEL_OUTPUT,
                      OTHER,
                      FINAL_OUTPUTS,
                      ALL,
                    ]
      responses:
        "200":
          description: Download urls returned successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistryEntityMutationResponse"
        "403":
          description: Unauthorized case access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/kanban/cases/{id}/status:
    patch:
      tags: [Kanban]
      summary: Update case status
      description: Moves a case between kanban stages in the in-memory mock store and records an optional note.
      operationId: updateKanbanCaseStatus
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCaseStatusRequest"
      responses:
        "200":
          description: Case status updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseMutationResponse"
        "400":
          description: Invalid status transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/production:
    get:
      tags: [Production]
      summary: List production queues
      description: Returns active production queues grouped from case_processes with status ready or in_progress.
      operationId: listProductionQueues
      responses:
        "200":
          description: Production queues returned successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductionListResponse"
  /api/case-processes/{id}:
    patch:
      tags: [Production]
      summary: Update case process
      description: Updates a real case workflow step. When status becomes completed, dependent locked steps are marked ready after all dependencies are completed.
      operationId: updateCaseProcess
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCaseProcessRequest"
      responses:
        "200":
          description: Case process updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseProcessMutationResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Case process not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/customers:
    get:
      tags: [Registry]
      summary: List customers
      description: Returns active, unarchived customers for the logged-in user's dental lab.
      operationId: listCustomers
      responses:
        "200":
          description: customers returned successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistryEntityMutationResponse"
    post:
      tags: [Registry]
      summary: Create customer
      description: Creates a customer for the logged-in user's dental lab.
      operationId: createCustomer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistryEntityPayload"
      responses:
        "201":
          description: customer created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistryEntityMutationResponse"
  /api/cad-designers:
    get:
      tags: [Registry]
      summary: List CAD designers
      description: Returns active, unarchived CAD designers for the logged-in user's dental lab.
      operationId: listCadDesigners
      responses:
        "200":
          description: CAD designers returned successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistryEntityMutationResponse"
    post:
      tags: [Registry]
      summary: Create CAD designer
      description: Creates a CAD designer user and lab membership for the logged-in user's dental lab.
      operationId: createCadDesigner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistryEntityPayload"
      responses:
        "201":
          description: CAD designer created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistryEntityMutationResponse"
  /api/service-types:
    get:
      tags: [Registry]
      summary: List service types
      description: Returns active, unarchived service types for the logged-in user's dental lab, including each service type's workflowJson template.
      operationId: listServiceTypes
      responses:
        "200":
          description: Service types returned successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceTypeListResponse"
    post:
      tags: [Registry]
      summary: Create service type
      description: Creates a service type for the logged-in user's dental lab. Optional `workflowJson.steps` rows must reference active processes in the same lab and have valid dependency ids.
      operationId: createServiceType
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceTypePayload"
      responses:
        "201":
          description: Service type created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceTypeMutationResponse"
  /api/processes:
    get:
      tags: [Processes]
      summary: List processes
      description: Returns active, unarchived reusable lab process definitions for the logged-in user's dental lab.
      operationId: listProcesses
      responses:
        "200":
          description: Processes returned successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessListResponse"
    post:
      tags: [Processes]
      summary: Create process
      description: Creates a reusable lab process definition for the logged-in user's dental lab.
      operationId: createProcess
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProcessPayload"
      responses:
        "201":
          description: Process created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessMutationResponse"
  /api/reports/cad-designer-cases:
    get:
      tags: [Production]
      summary: Disabled CAD designer cases report
      description: Returns a disabled mock response; PDF generation is not available in the mock runtime.
      operationId: getCadDesignerCasesReport
      responses:
        "200":
          description: Disabled report response returned successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      enabled:
                        type: boolean
                        const: false
                      message:
                        type: string
                      items:
                        type: array
                        items: {}
                  error:
                    type: "null"
                  meta:
                    type: object
                    additionalProperties: true
  /api/customers/{id}:
    patch:
      tags: [Registry]
      summary: Update customer
      description: Updates a customer by id.
      operationId: updateCustomer
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistryEntityPayload"
      responses:
        "200":
          description: customer updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistryEntityMutationResponse"
        "404":
          description: Registry entity not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [Registry]
      summary: Archive customer
      description: Archives a customer by setting `isActive=false` and `deletedAt` to the current timestamp.
      operationId: archiveCustomer
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: customer archived successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchiveEntityResponse"
  /api/cad-designers/{id}:
    patch:
      tags: [Registry]
      summary: Update CAD designer
      description: Updates a CAD designer by id.
      operationId: updateCadDesigner
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistryEntityPayload"
      responses:
        "200":
          description: CAD designer updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistryEntityMutationResponse"
    delete:
      tags: [Registry]
      summary: Archive CAD designer
      description: Archives the CAD designer user row by setting `isActive=false` and `deletedAt` to the current timestamp.
      operationId: archiveCadDesigner
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: CAD designer archived successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchiveEntityResponse"
  /api/service-types/{id}:
    patch:
      tags: [Registry]
      summary: Update service type
      description: Updates a service type by id. When `workflowJson` is present, it replaces the service type's workflow template.
      operationId: updateServiceType
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceTypePayload"
      responses:
        "200":
          description: Service type updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceTypeMutationResponse"
    delete:
      tags: [Registry]
      summary: Archive service type
      description: Archives a service type by setting `isActive=false` and `deletedAt` to the current timestamp.
      operationId: archiveServiceType
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Service type archived successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceTypeMutationResponse"
  /api/processes/{id}:
    patch:
      tags: [Processes]
      summary: Update process
      description: Updates a process by id.
      operationId: updateProcess
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProcessPayload"
      responses:
        "200":
          description: Process updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessMutationResponse"
    delete:
      tags: [Processes]
      summary: Archive process
      description: Archives a process by setting `isActive=false` and `deletedAt` to the current timestamp. Existing case process snapshots keep their copied process names.
      operationId: archiveProcess
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Process archived successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessMutationResponse"
  /api/registry/milling-drills/{id}/changed:
    post:
      tags: [Registry]
      summary: Mark milling drill changed
      description: Updates changedAt for a milling drill when it is replaced/serviced.
      operationId: markMillingDrillChanged
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Drill timestamp updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DrillChangedResponse"
        "404":
          description: Milling drill not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorObject:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: Explain what went wrong
    ErrorResponse:
      type: object
      required: [data, error, meta]
      properties:
        data:
          type: "null"
          example: null
        error:
          $ref: "#/components/schemas/ErrorObject"
        meta:
          type: object
          required: [limit]
          properties:
            limit:
              type: integer
              example: 100
    UserRole:
      type: string
      enum: [OWNER, ADMIN, MANAGER, PRODUCTION]
    CaseStatus:
      type: string
      enum:
        [
          ENTRY,
          WAITING_INFO,
          DESIGNING,
          WAITING_APPROVAL,
          DESIGN_READY,
          MILLING_PRINTING,
          DONE,
        ]
    CaseProcessStatus:
      type: string
      enum: [locked, ready, in_progress, completed, skipped, cancelled]
    AttachmentKind:
      type: string
      enum: [SCAN_INPUT, DESIGN_OUTPUT, MODEL_OUTPUT, OTHER]
    NotificationType:
      type: string
      enum: [CASE_ASSIGNED, SCAN_UPLOADED, DESIGN_UPLOADED, CASE_STATUS_CHANGED]
    UserSummary:
      type: object
      required: [id, name, email, role]
      properties:
        id:
          type: string
          example: 8f5ee9f0-8d21-4ad7-b50b-0123456789ab
        name:
          type: string
          example: Camila Santos
        email:
          type: string
          format: email
          example: designer@lab.com
        role:
          $ref: "#/components/schemas/UserRole"
    CustomerSummary:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          example: customer_001
        name:
          type: string
          example: Smile Center
    ServiceTypeSummary:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          example: service_001
        name:
          type: string
          example: Crown
        workflowJson:
          $ref: "#/components/schemas/ServiceTypeWorkflow"
    Process:
      type: object
      required: [id, dentalLabId, name, isActive, createdAt, updatedAt]
      properties:
        id:
          type: string
          example: process_001
        dentalLabId:
          type: string
          example: lab_001
        name:
          type: string
          example: Design
        description:
          type: string
          nullable: true
        isActive:
          type: boolean
          example: true
        deletedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ServiceTypeWorkflowStep:
      type: object
      required: [id, processId, dependsOn]
      properties:
        id:
          type: string
          example: design
        processId:
          type: string
          example: process_001
        dependsOn:
          type: array
          items:
            type: string
          example: []
    ServiceTypeWorkflow:
      type: object
      required: [steps]
      properties:
        steps:
          type: array
          items:
            $ref: "#/components/schemas/ServiceTypeWorkflowStep"
    CaseProcess:
      type: object
      required: [id, processId, workflowStepId, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          example: case_process_001
        processId:
          type: string
          example: process_001
        processName:
          type: string
          example: Design
        workflowStepId:
          type: string
          example: design
        status:
          $ref: "#/components/schemas/CaseProcessStatus"
        assignedToId:
          type: string
          nullable: true
        assignedToName:
          type: string
          nullable: true
        dependsOnCaseProcessIds:
          type: array
          items:
            type: string
        startedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CaseAttachment:
      type: object
      required: [id, kind, fileName, uploadedAt]
      properties:
        id:
          type: string
          example: attach_001
        kind:
          $ref: "#/components/schemas/AttachmentKind"
        fileName:
          type: string
          example: scan-upper.stl
        uploadedAt:
          type: string
          format: date-time
    CaseTimelineItem:
      type: object
      required: [id, toStatus, changedAt]
      properties:
        id:
          type: string
          example: hist_001
        fromStatus:
          allOf:
            - $ref: "#/components/schemas/CaseStatus"
          nullable: true
        toStatus:
          $ref: "#/components/schemas/CaseStatus"
        note:
          type: string
          nullable: true
          example: CAD aprovado
        changedAt:
          type: string
          format: date-time
    CaseSummary:
      type: object
      required:
        [id, code, patientName, currentStatus, isUrgent, createdAt, updatedAt]
      properties:
        id:
          type: string
          example: case_001
        dentalLabId:
          type: string
        code:
          type: string
          example: "0587"
        clientCaseCode:
          type: string
          nullable: true
          example: CL-44A
        patientName:
          type: string
